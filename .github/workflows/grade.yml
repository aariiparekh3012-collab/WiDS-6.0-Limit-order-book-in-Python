name: grade
on: [push, pull_request]
jobs:
  grade:
    # The template repo ships a stub Book, so it would always fail.
    # This runs on mentees' own copies (forks / "use this template" repos).
    if: github.repository != 'aariiparekh3012-collab/WiDS-6.0-Limit-order-book-in-Python'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {tier: 1, name: "Tier 1 core book (Week 1, mandatory)", optional: false}
          - {tier: 2, name: "Tier 2 IOC / FOK / modify (Week 2, mandatory)", optional: false}
          - {tier: 3, name: "Tier 3 self-trade prevention (optional)", optional: true}
          - {tier: 4, name: "Tier 4 compatibility (optional)", optional: true}
    name: ${{ matrix.name }}
    continue-on-error: ${{ matrix.optional }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python grade.py --tier ${{ matrix.tier }} -v
