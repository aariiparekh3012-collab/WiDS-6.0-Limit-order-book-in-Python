name: WiDS checkpoint grading
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      milestone:
        description: '1 = Foundation; 2 = mandatory cumulative; 3 = mandatory + optional STP'
        type: choice
        options: ['1', '2', '3']
        default: '1'
permissions:
  contents: read
jobs:
  starter:
    if: github.repository == 'aariiparekh3012-collab/WiDS-6.0-Limit-order-book-in-Python'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Check active fixtures and notebook format
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from collections import Counter
          root = Path('traces')
          manifest = json.loads((root / 'manifest.json').read_text())
          assert Counter(e['tier'] for e in manifest) == {1: 3, 2: 4, 3: 2}
          assert len({e['name'] for e in manifest}) == len(manifest)
          referenced = {e[k] for e in manifest for k in ('csv', 'golden')}
          assert referenced == {p.name for p in root.iterdir() if p.suffix in ('.csv', '.jsonl')}
          for e in manifest:
              assert (root / e['csv']).stat().st_size > 0
              rows = [json.loads(line) for line in (root / e['golden']).read_text().splitlines() if line.strip()]
              assert rows
          assert json.loads(Path('notebooks/analysis_template.ipynb').read_text())['cells']
          PY
      - name: Confirm starter TODO fails as expected
        run: |
          set +e
          python grade.py --tier 1 > starter.log 2>&1
          rc=$?
          set -e
          cat starter.log
          test "$rc" -eq 1
          grep -F "not implemented yet" starter.log
          grep -F "TOTAL 0/3" starter.log
  grade:
    if: github.repository != 'aariiparekh3012-collab/WiDS-6.0-Limit-order-book-in-Python'
    runs-on: ubuntu-latest
    env:
      MILESTONE: ${{ inputs.milestone || vars.WIDS_MILESTONE || '1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Validate milestone
        run: |
          case "$MILESTONE" in 1|2|3) ;; *) echo "Invalid WIDS_MILESTONE: $MILESTONE"; exit 1;; esac
      - name: Tier 1 core book (mandatory)
        run: python grade.py --tier 1 -v
      - name: Tier 2 advanced orders (mandatory from milestone 2)
        if: env.MILESTONE == '2' || env.MILESTONE == '3'
        run: python grade.py --tier 2 -v
      - name: Tier 3 Cancel Newest (optional)
        if: env.MILESTONE == '3'
        continue-on-error: true
        run: python grade.py --tier 3 -v
